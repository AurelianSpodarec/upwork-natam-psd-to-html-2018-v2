<html>
<head>

	<title>Natam</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://fonts.googleapis.com/css?family=Arimo:400,700,700i&amp;subset=hebrew" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="css/styles.css">

</head>
<body class="aligner" style="background-image: url(http://adwokatsowinski.pl/wp-content/uploads/2015/02/1-2-1.jpg)">

	<div class="vertical-mid">
	
	<header class="logo-header">	
		<h1 class="logo-header__title"><span>Natam</span></h1>
		<p class="logo-header__desc">נת"מ ניהול נכסים</p>
	</header>

	<div class="card card--login">
	<form class="">

			<header class="card__title">מערכת ניהול מסמכים</header>

			<div class="login-inputs">
			<input type="text" placeholder="שם משתמש">
			<input type="password" placeholder="סיסמא">
			</div>

			<footer class="card__footer">
				
				<div class="card__check-wrap">		
				<input type="checkbox" name="checkbox" id="login-checkbox" value="1">	
				<label class="login-label" for="login-checkbox">זכור אותי</label>
				</div>

				<div class="card__btn-wrap">
				<button class="btn-green">התחברות >></button>
				</div>

			</footer>

	</form>
	</div>
	</div>



</body>
</html>
